<!doctype html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#064e3b">
    <meta name="description" content="منوی دیجیتال هایپرمارکت">
    <title>منوی هایپرمارکت</title>
    <style>
        :root {
            --g: #064e3b;
            --g2: #047857;
            --g3: #ecfdf5;
            --bg: #f6f8f7;
            --text: #17211d;
            --muted: #718078;
            --line: #e4ebe7
        }

        * {
            box-sizing: border-box
        }

        html {
            scroll-behavior: smooth
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: Tahoma, "Segoe UI", Arial, sans-serif;
            -webkit-font-smoothing: antialiased
        }

        button,
        input {
            font: inherit
        }

        button {
            cursor: pointer
        }

        .top {
            position: sticky;
            top: 0;
            z-index: 20;
            background: rgba(255, 255, 255, .95);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--line)
        }

        .topin {
            max-width: 1180px;
            margin: auto;
            padding: 11px 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 9px;
            min-width: max-content
        }

        .logo {
            width: 42px;
            height: 42px;
            border-radius: 14px;
            background: var(--g);
            color: #fff;
            display: grid;
            place-items: center;
            font-weight: 900;
            font-size: 19px
        }

        .brand b {
            display: block;
            font-size: 15px;
            color: #073b2d
        }

        .brand small {
            color: #87928d;
            font-size: 10px
        }

        .search {
            position: relative;
            flex: 1;
            max-width: 540px;
            margin-right: auto
        }

        .search input {
            width: 100%;
            border: 1px solid var(--line);
            background: #f8faf9;
            border-radius: 15px;
            padding: 11px 40px 11px 12px;
            outline: 0;
            font-size: 12px
        }

        .search input:focus {
            background: #fff;
            border-color: #9bd5bf;
            box-shadow: 0 0 0 4px rgba(5, 150, 105, .08)
        }

        .glass {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #78857f
        }

        .wrap {
            max-width: 1180px;
            margin: auto;
            padding: 15px
        }

        .hero {
            border-radius: 27px;
            padding: 30px 22px;
            color: #fff;
            background: linear-gradient(135deg, #052e24, #047857);
            box-shadow: 0 18px 45px rgba(6, 78, 59, .18);
            overflow: hidden;
            position: relative
        }

        .hero:after {
            content: "";
            position: absolute;
            width: 230px;
            height: 230px;
            border-radius: 50%;
            left: -80px;
            bottom: -130px;
            background: rgba(255, 255, 255, .08)
        }

        .kicker {
            font-size: 11px;
            font-weight: 800;
            color: #a7f3d0
        }

        h1 {
            font-size: clamp(26px, 6vw, 42px);
            line-height: 1.35;
            margin: 8px 0;
            font-weight: 900
        }

        .hero p {
            margin: 0;
            max-width: 650px;
            color: #d1fae5;
            font-size: 12px;
            line-height: 2
        }

        .stats {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 17px
        }

        .stat {
            padding: 7px 10px;
            border: 1px solid rgba(255, 255, 255, .13);
            background: rgba(255, 255, 255, .1);
            border-radius: 11px;
            font-size: 10px
        }

        .chips {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 3px 0 5px;
            scrollbar-width: none
        }

        .chips::-webkit-scrollbar {
            display: none
        }

        .chip {
            flex: 0 0 auto;
            border: 1px solid var(--line);
            background: #fff;
            color: #5d6964;
            border-radius: 999px;
            padding: 9px 13px;
            font-size: 11px;
            font-weight: 800
        }

        .chip.active {
            background: var(--g);
            border-color: var(--g);
            color: #fff
        }

        .category {
            background: #fff;
            border: 1px solid #e5ece8;
            border-radius: 23px;
            padding: 16px;
            margin-top: 15px;
            box-shadow: 0 10px 35px rgba(16, 70, 45, .06)
        }

        .chead {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 13px
        }

        .chead h2 {
            margin: 0;
            font-size: 19px;
            color: #052e24
        }

        .chead p {
            margin: 5px 0 0;
            color: var(--muted);
            font-size: 10px
        }

        .count {
            white-space: nowrap;
            background: var(--g3);
            color: var(--g2);
            padding: 7px 10px;
            border-radius: 999px;
            font-size: 10px;
            font-weight: 900
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px
        }

        .card {
            border: 1px solid #e9eeeb;
            border-radius: 17px;
            overflow: hidden;
            background: #fff;
            min-width: 0;
            cursor: pointer
        }

        .photo {
            aspect-ratio: 1;
            background: #f5f7f6;
            display: grid;
            place-items: center;
            overflow: hidden
        }

        .photo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block
        }

        .fallback {
            display: none;
            color: #9aa49f;
            font-size: 10px;
            padding: 10px;
            text-align: center
        }

        .body {
            padding: 10px
        }

        .title {
            font-size: 11px;
            line-height: 1.8;
            font-weight: 900;
            min-height: 40px;
            color: #26332d
        }

        .desc {
            margin-top: 5px;
            color: #7a8580;
            font-size: 9px;
            line-height: 1.8;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden
        }

        .more {
            margin-top: 8px;
            color: var(--g2);
            font-size: 9px;
            font-weight: 900
        }

        .empty {
            text-align: center;
            padding: 45px 15px;
            color: #77837d;
            font-size: 12px
        }

        .footer {
            text-align: center;
            color: #89948f;
            font-size: 10px;
            padding: 5px 15px 32px
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 50;
            background: rgba(0, 0, 0, .52);
            padding: 14px;
            align-items: flex-end;
            justify-content: center
        }

        .modal.show {
            display: flex
        }

        .modalbox {
            width: min(620px, 100%);
            max-height: 90vh;
            overflow: auto;
            background: #fff;
            border-radius: 24px;
            padding: 16px
        }

        .mhead {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px
        }

        .mhead h3 {
            margin: 0;
            font-size: 17px;
            line-height: 1.7;
            color: #052e24
        }

        .close {
            border: 0;
            background: #eff3f1;
            width: 38px;
            height: 38px;
            border-radius: 12px;
            font-size: 20px
        }

        .mphoto {
            margin-top: 12px;
            aspect-ratio: 1.15;
            background: #f6f8f7;
            border-radius: 17px;
            overflow: hidden
        }

        .mphoto img {
            width: 100%;
            height: 100%;
            object-fit: contain
        }

        .mdesc {
            color: #68746e;
            font-size: 11px;
            line-height: 2;
            margin: 12px 0 3px
        }

        @media(min-width:700px) {
            .grid {
                grid-template-columns: repeat(4, minmax(0, 1fr));
                gap: 14px
            }

            .category {
                padding: 21px
            }

            .hero {
                padding: 40px 36px
            }

            .modal {
                align-items: center
            }
        }

        @media(max-width:560px) {
            .search {
                order: 3;
                flex-basis: 100%;
                max-width: none
            }

            .brand small {
                display: none
            }
        }
    </style>
</head>

<body>
    <header class="top">
        <div class="topin">
            <div class="brand">
                <div class="logo">ه</div>
                <div><b>هایپرمارکت</b><small>منوی محصولات</small></div>
            </div>
            <div class="search"><span class="glass">⌕</span><input id="search" type="search"
                    placeholder="جستجوی محصول..." autocomplete="off"></div>
        </div>
    </header>

    <section class="wrap">
        <div class="hero">
            <div class="kicker">منوی دیجیتال فروشگاه</div>
            <h1>محصولات هایپرمارکت</h1>
            <p>محصولات فروشگاه را در دسته‌بندی‌های مختلف مشاهده کنید و با جستجو، محصول موردنظر خود را سریع‌تر پیدا کنید.
            </p>
            <div class="stats">
                <div class="stat">تعداد محصولات: <b id="total">0</b></div>
                <div class="stat">۴ دسته‌بندی</div>
            </div>
        </div>
    </section>

    <nav class="wrap">
        <div class="chips" id="chips"></div>
    </nav>
    <main class="wrap" id="content"></main>
    <div class="footer">خرید آسان، انتخاب مطمئن</div>

    <div class="modal" id="modal">
        <div class="modalbox">
            <div class="mhead">
                <h3 id="mtitle"></h3><button class="close" id="close">×</button>
            </div>
            <div class="mphoto"><img id="mimage" alt=""></div>
            <div class="mdesc" id="mdesc"></div>
        </div>
    </div>

    <script>
        const products = [{ "id": 5, "name": "شامپو نارگیل انواع مو حاجی شاکر ۵۰۰ میل", "category": "بهداشتی", "description": "شامپو نارگیل حاجی شاکر مناسب انواع مو، با عصاره خالص نارگیل که به تغذیه و ترمیم مو، افزایش درخشندگی و حفظ رطوبت و نرمی مو کمک می‌کند. مناسب استفاده روزانه بانوان و آقایان.", "image": "./products/015.jpeg" }, { "id": 6, "name": "اسپری خوشبو کننده محیط حیات آلفا ۳۵۰ میل", "category": "شوینده", "description": "اسپری خوشبو کننده محیط حیات آلفا با رایحه لوندر و حجم ۳۵۰ میلی‌لیتر، مناسب برای خانه و محل کار با رایحه‌ای دل‌انگیز و ماندگاری بالا.", "image": "./products/018.jpeg" }, { "id": 7, "name": "اسپری خوشبو کننده هوا حیات Spring ۳۵۰ میل", "category": "شوینده", "description": "اسپری خوشبو کننده هوا حیات Spring با رایحه گل‌های بهاری، فضایی تازه، دلپذیر و آرامش‌بخش در خانه ایجاد می‌کند و با پخش یکنواخت، رایحه‌ای سبک و ماندگار به محیط می‌بخشد.", "image": "./products/016.jpeg" }, { "id": 8, "name": "شامپو عصاره روغن بادام حاجی شاکر", "category": "بهداشتی", "description": "شامپو حاجی شاکر با عصاره روغن بادام، مناسب مراقبت از مو و کمک به تقویت و حفظ سلامت موها. فرمول حاوی روغن بادام به مراقبت از مو و کاهش ریزش ناشی از ضعف و آسیب مو کمک می‌کند.", "image": "./products/011.jpeg" }, { "id": 9, "name": "قرص ماشین ظرفشویی پلاتینوم فیری", "category": "شوینده", "description": "قرص ماشین ظرفشویی پلاتینوم فیری با قدرت پاک‌کنندگی بالا، مناسب شست‌وشوی ظروف و از بین بردن چربی و آلودگی‌ها. دارای جلادهنده بیشتر و قابلیت کمک به جرم‌گیری فیلتر ماشین ظرفشویی در هر بار شست‌وشو.", "image": "./products/013.jpeg" }, { "id": 10, "name": "قرص ماشین ظرفشویی فینیش پاوربال کوانتوم مکس", "category": "شوینده", "description": "قرص ماشین ظرفشویی فینیش پاوربال کوانتوم مکس با قدرت شویندگی و چربی‌زدایی بالا، مناسب از بین بردن لکه‌ها و مواد غذایی خشک‌شده روی ظروف. دارای ترکیبات براق‌کننده و قدرت پاک‌کنندگی بالا برای شست‌وشوی مؤثر ظروف.", "image": "./products/012.jpeg" }, { "id": 11, "name": "مایع براق کننده ماشین ظرفشویی فینیش", "category": "شوینده", "description": "مایع براق‌کننده ماش         const info = {
            "بهداشتی": { title: "محصولات بهداشتی", desc: "محصولات بهداشتی و مراقبت شخصی" },
            "شوینده": { title: "شوینده‌ها", desc: "انواع شوینده و محصولات نظافتی" },
            "نوشیدنی": { title: "نوشیدنی‌ها", desc: "انواع نوشیدنی و آب آشامیدنی" },
            "مواد غذایی": { title: "مواد غذایی", desc: "انواع مواد غذایی و خوراکی" }
        };
        const order = ["همه", "بهداشتی", "شوینده", "نوشیدنی", "مواد غذایی"];
        let active = "همه", q = "";
        const content = document.getElementById("content"), chips = document.getElementById("chips"), search = document.getElementById("search"), modal = document.getElementById("modal");
        document.getElementById("total").textContent = products.length;
        function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[c])) }
        function chipRender() { chips.innerHTML = order.map(c => `<button class="chip ${c === active ? "active" : ""}" data-c="${c}">${c === "همه" ? "همه محصولات" : info[c].title}</button>`).join(""); chips.querySelectorAll("button").forEach(b => b.onclick = () => { active = b.dataset.c; render() }) }
        function card(p) { return `<article class="card" data-id="${p.id}"><div class="photo"><img src="${p.image}" alt="${esc(p.name)}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><div class="fallback">تصویر محصول در دسترس نیست</div></div><div class="body"><div class="title">${esc(p.name)}</div><div class="desc">${esc(p.description)}</div><div class="more">مشاهده جزئیات ←</div></div></article>` }
        function render() {
            chipRender();
            const qq = q.trim().toLocaleLowerCase("fa");
            const filtered = products.filter(p => (active === "همه" || p.category === active) && (!qq || (p.name + " " + p.description).toLocaleLowerCase("fa").includes(qq)));
            if (!filtered.length) { content.innerHTML = '<div class="empty">محصولی مطابق جستجو یا دسته‌بندی انتخاب‌شده پیدا نشد.</div>'; return }
            if (active !== "همه" || qq) {
                content.innerHTML = `<section class="category"><div class="chead"><div><h2>${active === "همه" ? "نتایج جستجو" : info[active].title}</h2><p>${qq ? "نتایج مطابق عبارت جستجو" : info[active].desc}</p></div><span class="count">${filtered.length} محصول</span></div><div class="grid">${filtered.map(card).join("")}</div></section>`;
            } else {
                content.innerHTML = order.slice(1).map(c => { const a = products.filter(p => p.category === c); return `<section class="category"><div class="chead"><div><h2>${info[c].title}</h2><p>${info[c].desc}</p></div><span class="count">${a.length} محصول</span></div><div class="grid">${a.map(card).join("")}</div></section>` }).join("");
            }
            content.querySelectorAll(".card").forEach(el => el.onclick = () => openProduct(+el.dataset.id));
        }
        function openProduct(id) { const p = products.find(x => x.id === id); if (!p) return; document.getElementById("mtitle").textContent = p.name; document.getElementById("mdesc").textContent = p.description; const i = document.getElementById("mimage"); i.src = p.image; i.alt = p.name; modal.classList.add("show"); document.body.style.overflow = "hidden" }
        function closeModal() { modal.classList.remove("show"); document.body.style.overflow = "" }
        document.getElementById("close").onclick = closeModal; modal.onclick = e => { if (e.target === modal) closeModal() }; document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal() });
        search.oninput = e => { q = e.target.value; render() }; render();
    </script>
