<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیریت محصولات هایپر</title><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;900&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7f5;color:#17211d;font:14px Vazirmatn,Tahoma,sans-serif}.wrap{max-width:1050px;margin:auto;padding:18px}.head,.panel,.item{background:#fff;border:1px solid #e2eae5;border-radius:16px;padding:16px;margin-bottom:13px}.head{background:#064e3b;color:white}.head h1{margin:0 0 4px}.head p{margin:0;color:#d1fae5}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.field{display:grid;gap:5px}.field label{font-size:12px;font-weight:700}.field input,.field textarea,.field select{font:inherit;padding:10px;border:1px solid #dce5df;border-radius:9px;width:100%}.field textarea{min-height:75px}.full{grid-column:1/-1}.bar,.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button{font:inherit;font-weight:700;border:0;border-radius:9px;padding:9px 13px;background:#047857;color:white;cursor:pointer}.secondary{background:#e8f3ed;color:#075e43}.danger{background:#fff1f2;color:#be123c}.item{display:flex;align-items:center;gap:12px}.item img{width:62px;height:62px;object-fit:contain;background:#f2f5f3;border-radius:9px}.main{flex:1}.main small{display:block;color:#66746d}.hidden{display:none!important}.status{padding:9px;background:#ecfdf5;color:#047857;border-radius:9px;margin-top:10px}.err{background:#fff1f2;color:#be123c}@media(max-width:600px){.grid{grid-template-columns:1fr}.item{flex-wrap:wrap}.actions{width:100%}.actions button{flex:1}}
</style></head><body><main class="wrap"><header class="head"><h1>پنل مدیریت محصولات</h1><p>تغییرات در فایل‌های همین پروژه ذخیره می‌شود؛ سپس آن‌ها را بازبینی و Commit/Push کنید.</p></header>
<section class="panel"><div class="field"><label>رمز مدیر محلی</label><input id="password" type="password" placeholder="رمز تعیین‌شده هنگام اجرای سرور"></div><div class="bar"><button id="load">بارگذاری محصولات</button><button class="secondary" id="new">افزودن محصول</button></div><div id="status" class="status hidden"></div></section>
<section id="editor" class="panel hidden"><h2 id="heading">محصول جدید</h2><form id="form"><input id="id" type="hidden"><div class="grid">
<div class="field"><label>نام</label><input id="name" required></div><div class="field"><label>دسته‌بندی</label><select id="category"><option>بهداشتی</option><option>شوینده</option><option>نوشیدنی</option><option>مواد غذایی</option></select></div>
<div class="field"><label>قیمت (تومان)</label><input id="price" type="text" inputmode="numeric" placeholder="مثلاً ۵۵۰۰۰۰ برای ۵۵۰ هزار تومان"></div><div class="field"><label>موجودی</label><select id="stock"><option value="yes">موجود</option><option value="no">ناموجود</option></select></div>
<div class="field full"><label>توضیحات</label><textarea id="description"></textarea></div><div class="field"><label>انتخاب عکس JPG/PNG/WebP</label><input id="file" type="file" accept="image/jpeg,image/png,image/webp"></div><div class="field"><label>مسیر عکس</label><input id="image" placeholder="./products/file.jpg"></div>
</div><div class="actions"><button>ذخیره</button><button type="button" class="secondary" id="cancel">لغو</button></div></form></section>
<section class="panel"><div class="field"><label>جستجو</label><input id="query" placeholder="نام محصول"></div><p id="count">بارگذاری نشده</p></section><section id="list"></section></main>
<script>
let products=[];const $=id=>document.getElementById(id);const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function msg(s,err=false){$("status").textContent=s;$("status").classList.remove("hidden","err");if(err)$("status").classList.add("err")}
async function api(path,opts={}){let headers={...(opts.headers||{})};if(opts.method)headers["x-admin-password"]=$("password").value;let r=await fetch(path,{...opts,headers});let d=await r.json();if(!r.ok)throw Error(d.error||"خطا");return d}
async function load(){try{products=await api("/api/products");draw();msg("بارگذاری شد")}catch(e){msg(e.message,true)}}
function draw(){let q=$("query").value.trim().toLocaleLowerCase("fa"),a=products.filter(p=>!q||p.name.toLocaleLowerCase("fa").includes(q));$("count").textContent=products.length+" محصول";$("list").innerHTML=a.map(p=>'<article class="item"><img src="'+esc(p.image)+'"><div class="main"><b>'+esc(p.name)+'</b><small>'+esc(p.category)+' · '+(p.price?Number(p.price).toLocaleString("fa-IR")+" تومان":"بدون قیمت")+' · '+(p.inStock===false?"ناموجود":"موجود")+'</small></div><div class="actions"><button class="secondary" data-edit="'+p.id+'">ویرایش</button><button class="danger" data-del="'+p.id+'">حذف</button></div></article>').join("")||'<div class="panel">محصولی پیدا نشد.</div>';document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>edit(+b.dataset.edit));document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>remove(+b.dataset.del))}
function edit(id){let p=products.find(x=>x.id===id);$("editor").classList.remove("hidden");$("heading").textContent="ویرایش محصول";$("id").value=p.id;$("name").value=p.name;$("category").value=p.category;$("price").value=p.price??"";$("stock").value=p.inStock===false?"no":"yes";$("description").value=p.description||"";$("image").value=p.image||"";$("file").value="";$("editor").scrollIntoView({behavior:"smooth"})}
function reset(){ $("form").reset();$("id").value="";$("editor").classList.add("hidden");$("heading").textContent="محصول جدید" }
function parsePrice(raw){raw=raw.trim();if(!raw)return null;let n=raw.replace(/[۰-۹]/g,d=>String("۰۱۲۳۴۵۶۷۸۹".indexOf(d))).replace(/[٠-٩]/g,d=>String("٠١٢٣٤٥٦٧٨٩".indexOf(d))).replace(/[٬,،\s]/g,"");if(!/^\d+$/.test(n))throw Error("قیمت را فقط با رقم وارد کنید؛ برای ۵۵۰ هزار تومان عدد ۵۵۰۰۰۰ را بنویسید.");let value=Number(n);if(!Number.isSafeInteger(value))throw Error("عدد قیمت معتبر نیست.");return value}
async function save(e){e.preventDefault();try{let id=$("id").value,image=$("image").value.trim(),f=$("file").files[0];if(f){if(!["image/jpeg","image/png","image/webp"].includes(f.type))throw Error("فرمت عکس پشتیبانی نمی‌شود");let data=await new Promise((ok,no)=>{let r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)});image=(await api("/api/upload",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({data})})).path}if(!image)throw Error("عکس یا مسیر آن را وارد کنید");let p={id:id?+id:Math.max(0,...products.map(x=>+x.id||0))+1,name:$("name").value.trim(),category:$("category").value,description:$("description").value.trim(),image,price:parsePrice($("price").value),inStock:$("stock").value==="yes"};if(id)products=products.map(x=>x.id===p.id?p:x);else products.push(p);await api("/api/products",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(products)});draw();reset();msg("روی این کامپیوتر ذخیره شد. برای نمایش در Vercel، فایل‌ها را Commit و Push کنید.")}catch(e){msg(e.message,true)}}
async function remove(id){let p=products.find(x=>x.id===id);if(!confirm("حذف «"+p.name+"»؟"))return;products=products.filter(x=>x.id!==id);try{await api("/api/products",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(products)});draw();msg("محصول حذف شد.")}catch(e){msg(e.message,true)}}
$("load").onclick=load;$("new").onclick=()=>{$("form").reset();$("id").value="";$("editor").classList.remove("hidden")};$("cancel").onclick=reset;$("form").onsubmit=save;$("query").oninput=draw;
</script></body></html>
